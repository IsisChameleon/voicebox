name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build and Install"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install development dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest

      # continue-on-error: pyright currently reports 4 pre-existing errors
      # (agent.py:389, browser_session.py:30,31,73 — Optional/global typing,
      # unrelated to this CI change) that predate this workflow step. Keep
      # the step visible so regressions are caught, but non-blocking until a
      # follow-up task fixes those findings and this is flipped back to
      # required.
      - name: Type check
        run: uv run pyright src/
        continue-on-error: true

      - name: Build project
        run: uv build

      - name: Install project in editable mode
        run: uv pip install --editable .
